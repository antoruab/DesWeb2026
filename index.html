<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desarrollo Web</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./src/css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="#">
        <img src="./src/img/logo.png" alt="logo" width="35" class="me-2">
        Desarrollo Web
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#tarjetas">Contenido</a></li>
          <li class="nav-item"><a class="nav-link" href="#footer">Contacto</a></li>
        </ul>
        <!-- Botón modo oscuro/claro -->
        <button id="toggle-theme" class="btn btn-outline-light ms-lg-3 mt-2 mt-lg-0">🌙</button>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL: 3 tarjetas -->
  <main class="container my-5" id="tarjetas">
    <div class="d-flex flex-wrap justify-content-center gap-4">

      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Tarjeta 1</h5>
          <p class="card-text">Texto de la primera tarjeta.</p>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Tarjeta 2</h5>
          <p class="card-text">Texto de la segunda tarjeta.</p>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Tarjeta 3</h5>
          <p class="card-text">Texto de la tercera tarjeta.</p>
        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer id="footer" class="text-light py-4">
    <div class="container d-flex flex-wrap justify-content-between">
      <div>
        <p class="mb-1">Contacto: tucorreo@usbcali.edu.co</p>
        <p class="mb-0">&copy; 2026 Desarrollo Web</p>
      </div>
      <div class="d-flex flex-column">
        <a href="#" class="footer-link">Inicio</a>
        <a href="#tarjetas" class="footer-link">Contenido</a>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS (necesario para el navbar responsive) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Mi JS -->
  <script src="js/script.js"></script>

</html>
