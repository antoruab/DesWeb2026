<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../src/img/logo.png">
    <title>Procesar Solicitud - Biblioteca</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="./style.css" rel="stylesheet">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <img src="../src/img/logo.png" alt="logo" width="35" class="me-2">
                Desarrollo Web
            </a>
            <a href="../index.html" class="btn btn-outline-light ms-auto">← Volver</a>
        </div>
    </nav>

    <div class="content-wrapper">
        <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
            <h1 class="text-center mb-1">Solicitud de préstamo</h1>
            <p class="text-center text-muted mb-4">Procesa la solicitud de un usuario</p>

            <div class="mb-3">
                <label class="form-label">Nombre del usuario</label>
                <input type="text" id="nombreUsuario" class="form-control" placeholder="Ej: Antonia">
            </div>

            <div class="mb-3">
                <label class="form-label">Títulos de los libros (separados por coma)</label>
                <input type="text" id="libros" class="form-control" placeholder="Ej: 1984, Los juegos del hambre">
            </div>

            <button class="btn btn-lg w-100" id="btnProcesar" onclick="ejecutar()">Procesar solicitud</button>

            <div class="mt-4 text-center">
                <p id="resultado" class="fw-bold"></p>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
